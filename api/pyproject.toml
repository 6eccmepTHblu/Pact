[project]
name = "pact-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "openai>=3.23.0",
    "pgvector>=0.5.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
